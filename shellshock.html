<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShellShock.io</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 20px 0;
        }
        
        #game-frame {
            width: 100%;
            height: 600px;
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
        
        #fullscreen-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            z-index: 10;
        }
        
        #fullscreen-btn:hover {
            background-color: #45a049;
        }
        
        h1 {
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>ShellShock.io</h1>
    
    <div id="game-container">
        <iframe id="game-frame" src="https://shellshock.io" allowfullscreen></iframe>
        <button id="fullscreen-btn">全螢幕</button>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gameContainer = document.getElementById('game-container');
            const gameFrame = document.getElementById('game-frame');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            
            // 全螢幕按鈕功能
            fullscreenBtn.addEventListener('click', function() {
                if (gameFrame.requestFullscreen) {
                    gameFrame.requestFullscreen();
                } else if (gameFrame.webkitRequestFullscreen) { /* Safari */
                    gameFrame.webkitRequestFullscreen();
                } else if (gameFrame.msRequestFullscreen) { /* IE11 */
                    gameFrame.msRequestFullscreen();
                }
            });
            
            // 監聽全螢幕變化
            document.addEventListener('fullscreenchange', exitHandler);
            document.addEventListener('webkitfullscreenchange', exitHandler);
            document.addEventListener('mozfullscreenchange', exitHandler);
            document.addEventListener('MSFullscreenChange', exitHandler);
            
            function exitHandler() {
                if (!document.fullscreenElement && 
                    !document.webkitIsFullScreen && 
                    !document.mozFullScreen && 
                    !document.msFullscreenElement) {
                    // 退出全螢幕時的操作（如果需要）
                }
            }
        });
    </script>
</body>
</html>
