<!DOCTYPE html>
<html>
<head>
    <title>ShellShock 遊戲入口</title>
    <style>
        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        #gameButton {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <button id="gameButton" onclick="loadGame()">啟動遊戲</button>

    <script>
        function loadGame() {

            window.open('https://shellshock.io/', '_blank');

            document.getElementById('gameButton').style.display = 'none';
            */

    </script>
</body>
</html>
